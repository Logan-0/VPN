[package]
name = "rust-vpn"
version = "0.1.0"
edition = "2021"
authors = ["RustVPN Team"]
description = "A secure, lightweight VPN with DNS filtering"
license = "MIT"

[package.metadata.deb]
name = "rust-vpn"
maintainer = "RustVPN Team <support@rustvpn.example>"
copyright = "2025, RustVPN Team"
license-file = ["LICENSE", "0"]
extended-description = """\
A secure, lightweight VPN client written in Rust using the WireGuard protocol.
It includes a graphical interface, a kill switch, DNS filtering, and automatic
reconnection — all cross-platform across Linux, macOS, and Windows.
"""
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/rust-vpn", "usr/bin/rust-vpn", "755"],
    ["README.md", "usr/share/doc/rust-vpn/README", "644"],
    ["debian/rust-vpn.desktop", "usr/share/applications/rust-vpn.desktop", "644"],
]
maintainer-scripts = "debian/"

[dependencies]
# Async runtime — trimmed from "full" to what's actually used (runtime
# construction, select!/test/main macros, mpsc/watch channels, sleep/interval,
# UdpSocket, and task::spawn_blocking). Add features back if `cargo build`
# reports a missing one; see OptimizationExecutionSpec.md #3.
tokio = { version = "1.41", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net"] }

# WireGuard protocol
boringtun = "0.6"

# DNS resolution and filtering
hickory-resolver = { version = "0.24", features = ["dns-over-https-rustls", "dns-over-rustls"] }

# TLS for control channel
rustls = "0.23"
rustls-native-certs = "0.8"

# GUI framework (Iced -- cross-platform, pure Rust, Elm-architecture)
iced = { version = "0.13", features = ["tokio", "wgpu"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# HTTP client for update checking
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Security - memory wiping
zeroize = "1.8"

# Cryptography utilities
rand = "0.8"
base64 = "0.22"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Network interface management
tun = "0.6"

# Platform-specific dependencies
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["net", "socket", "ioctl", "user"] }
caps = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
] }
# WinTun: a Layer-3 TUN driver for Windows. The crate dynamically loads
# wintun.dll at runtime; the DLL must be bundled alongside the binary or
# present on PATH. See https://www.wintun.net/ for the official driver.
wintun = "0.5"

[dev-dependencies]
# Testing
tokio-test = "0.4"
mockall = "0.13"

[profile.release]
opt-level = 3       # Favor packet-loop throughput/latency over binary size
                    # (was "z" — this is a per-packet crypto/routing hot path,
                    # not a size-constrained embedded target; see OptimizationExecutionSpec.md #1)
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols
# panic = "abort" intentionally NOT set: KillSwitch/LinuxPlatform/Tunnel all
# rely on Drop to remove firewall rules / TUN devices if something goes wrong.
# "abort" skips unwinding, so those Drop impls would never run on a panic,
# defeating that safety net (see ErrorHandlingExecutionSpec.md P1). The
# default `panic = "unwind"` costs a small amount of binary size in exchange
# for that cleanup guarantee actually firing.
