# RustVPN Server Configuration
# ============================================================================
# This file lists the VPN servers RustVPN can connect to. It is loaded by
# `ServerManager::new()` (src/server.rs) at application startup.
#
# IMPORTANT: PLACEHOLDER VALUES
# -----------------------------
# The endpoints and public keys below are **placeholders** for development
# and testing. They use:
#   - RFC 5737 (TEST-NET-1) IPs (203.0.113.0/24) which are reserved for
#     documentation and never routable on the public internet.
#   - Cryptographically random 32-byte values base64-encoded as WireGuard
#     X25519 public keys. They are the correct shape and will parse, but
#     no real WireGuard server holds the matching private key, so a real
#     Noise handshake will fail.
#
# This makes the full code path -- TUN creation, kill switch activation,
# Noise handshake start -- exercisable end-to-end without spinning up
# real VPN infrastructure. Replace with real values before publishing.
#
# To swap in real servers:
#   1. Set `server_endpoint_address` to "<public_ip>:<udp_port>"
#   2. Set `server_public_key_base64` to the output of `wg pubkey` on the
#      server's public key file
#   3. Ensure the server is configured to route the client's TUN IP
#      (default 10.8.0.2/24, configurable via `client_tun_ip_cidr` in
#      the user's config.toml).

