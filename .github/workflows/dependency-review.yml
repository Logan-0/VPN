name: Dependency Review

# Scans dependency changes in pull requests for known vulnerabilities and
# license issues.

on: [pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
