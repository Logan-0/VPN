name: Release

# Builds a Debian package for rust-vpn on every pushed version tag (v*)
# and uploads it as a GitHub release artifact. The .deb can be downloaded
# and installed on any Linux target.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deb:
    name: Build and release .deb package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup show

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Build release binary and Debian package
        run: cargo deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-vpn-deb
          path: target/debian/*.deb

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: target/debian/*.deb
          generate_release_notes: true
