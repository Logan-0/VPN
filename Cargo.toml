[package]
name = "rust-vpn"
version = "0.1.0"
edition = "2021"
authors = ["RustVPN Team"]
description = "A secure, lightweight VPN with DNS filtering"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# WireGuard protocol
boringtun = "0.6"

# DNS resolution and filtering
hickory-resolver = { version = "0.24", features = ["dns-over-https-rustls", "dns-over-rustls"] }

# TLS for control channel
rustls = "0.23"
rustls-native-certs = "0.8"

# GUI framework (Iced -- cross-platform, pure Rust, Elm-architecture)
iced = { version = "0.13", features = ["tokio"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# HTTP client for update checking
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Security - memory wiping
zeroize = "1.8"

# Cryptography utilities
rand = "0.8"
base64 = "0.22"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Network interface management
tun = "0.6"

# Platform-specific dependencies
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["net", "socket", "ioctl", "user"] }
caps = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Testing
tokio-test = "0.4"
mockall = "0.13"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols
panic = "abort"     # Smaller binary
